[package]
name = "animepet"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
tiny_http = "0.12"
cairo-rs = "0.18"
ureq = { version = "3.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
