<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Anime Pet</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        :root {
            --chat-bg: rgba(22, 25, 32, .94);
            --chat-surface: rgba(255, 255, 255, .065);
            --chat-border: rgba(255, 255, 255, .14);
            --chat-text: #f7f3ef;
            --chat-muted: #aeb2bd;
            --chat-coral: #e58b9e;
            --chat-coral-hover: #f0a1b1;
            --chat-mint: #77c0b2;
            --chat-blue: #8aa9d6;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent !important;
        }
        #landlord {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 280px;
            height: 250px;
            z-index: 10000;
            cursor: pointer;
            touch-action: none;
        }
        #landlord::before {
            content: '';
            position: absolute;
            inset: -14px;
            pointer-events: auto;
        }
        #live2d {
            position: relative;
            z-index: 1;
        }

        /* 对话气泡：半透明白底 + 柔和阴影 + 圆角 + 指向模型的小尾巴 */
        .message {
            opacity: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 244px;
            max-width: 236px;
            padding: 9px 14px;
            background: rgba(255, 252, 248, .82);
            border: 1px solid rgba(255, 255, 255, .72);
            color: #30343c;
            border-radius: 12px 12px 12px 4px;
            font-size: 12px;
            font-weight: 520;
            line-height: 1.55;
            text-align: center;
            box-shadow: 0 8px 24px rgba(25, 28, 36, .16);
            backdrop-filter: blur(10px) saturate(1.12);
            -webkit-backdrop-filter: blur(10px) saturate(1.12);
            box-sizing: border-box;
            word-break: break-word;
            z-index: 10;
        }
        .message::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 18px;
            transform: rotate(45deg);
            width: 9px;
            height: 9px;
            background: rgba(255, 252, 248, .82);
            border-right: 1px solid rgba(255, 255, 255, .72);
            border-bottom: 1px solid rgba(255, 255, 255, .72);
        }

        #chat-panel {
            display: none;
            position: fixed;
            z-index: 19999;
            grid-template-rows: 44px minmax(0, 1fr) auto;
            width: min(340px, calc(100vw - 24px));
            height: min(372px, calc(100vh - 24px));
            min-height: 260px;
            overflow: hidden;
            color: var(--chat-text);
            background: var(--chat-bg);
            border: 1px solid var(--chat-border);
            border-radius: 12px;
            box-shadow: 0 24px 60px rgba(8, 10, 16, .38), 0 4px 14px rgba(8, 10, 16, .2);
            font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            backdrop-filter: blur(20px) saturate(1.16);
            -webkit-backdrop-filter: blur(20px) saturate(1.16);
        }
        #chat-panel.is-open {
            display: grid;
            animation: chat-in .14s ease-out;
        }
        @keyframes chat-in {
            from { opacity: 0; transform: translateY(5px) scale(.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        #chat-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
            padding: 0 9px 0 12px;
            background: linear-gradient(110deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .chat-identity { display: flex; align-items: center; min-width: 0; gap: 8px; }
        .chat-status { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--chat-mint); box-shadow: 0 0 0 3px rgba(119,192,178,.13), 0 0 10px rgba(119,192,178,.34); }
        .chat-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
        .chat-name strong { overflow: hidden; color: var(--chat-text); font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
        .chat-name small { margin-top: 2px; color: var(--chat-muted); font-size: 10px; }
        .chat-name small.is-action { color: var(--chat-coral); cursor: pointer; }
        .chat-actions { display: flex; align-items: center; gap: 2px; }
        #chat-model,
        #chat-mute {
            display: grid;
            width: 28px;
            height: 28px;
            padding: 0;
            place-items: center;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--chat-muted);
            font: 15px/1 sans-serif;
            cursor: pointer;
        }
        #chat-model:hover,
        #chat-mute:hover { background: rgba(255,255,255,.08); color: var(--chat-text); }
        #chat-model:disabled { cursor: default; opacity: .42; }
        #chat-mute.is-muted { color: var(--chat-coral); }
        #chat-close {
            display: grid;
            width: 28px;
            height: 28px;
            padding: 0;
            place-items: center;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--chat-muted);
            font: 20px/1 sans-serif;
            cursor: pointer;
        }
        #chat-close:hover { background: rgba(255,255,255,.08); color: var(--chat-text); }
        #chat-log {
            min-height: 0;
            overflow-y: auto;
            padding: 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,.2) transparent;
        }
        .chat-line { max-width: 88%; margin: 0 0 10px; padding: 9px 11px; white-space: pre-wrap; word-break: break-word; letter-spacing: .01em; }
        .chat-line.user { margin-left: auto; border: 1px solid rgba(229,139,158,.3); border-radius: 11px 11px 4px 11px; background: rgba(229,139,158,.16); color: #fff5f7; }
        .chat-line.assistant { margin-right: auto; border: 1px solid rgba(119,192,178,.22); border-radius: 11px 11px 11px 4px; background: rgba(119,192,178,.11); color: #eff8f5; }
        #chat-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 38px 52px;
            align-items: end;
            gap: 7px;
            min-height: 57px;
            padding: 9px;
            border-top: 1px solid rgba(255,255,255,.09);
            background: rgba(8, 10, 14, .28);
        }
        #chat-input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 38px;
            min-height: 38px;
            max-height: 82px;
            resize: none;
            overflow-y: auto;
            padding: 9px 10px;
            outline: none;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 8px;
            background: rgba(8, 10, 14, .38);
            color: var(--chat-text);
            font: 13px/18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            transition: border-color .14s, box-shadow .14s, background .14s;
        }
        #chat-input::placeholder { color: #8f929a; }
        #chat-input:focus { border-color: rgba(229,139,158,.78); background: rgba(8,10,14,.52); box-shadow: 0 0 0 3px rgba(229,139,158,.13); }
        #chat-send {
            width: 52px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(145deg, var(--chat-coral-hover), var(--chat-coral));
            color: #2c1b21;
            font: 650 12px/1 sans-serif;
            cursor: pointer;
            transition: background .14s, transform .14s, opacity .14s;
        }
        #chat-send:hover { background: var(--chat-coral-hover); }
        #chat-send:active { transform: translateY(1px); }
        #chat-send:disabled { cursor: default; opacity: .5; }
        #chat-record {
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 8px;
            background: rgba(8, 10, 14, .38);
            color: var(--chat-muted);
            font: 17px/1 sans-serif;
            cursor: pointer;
            transition: background .14s, color .14s, border-color .14s;
        }
        #chat-record:hover { background: rgba(255,255,255,.1); color: var(--chat-text); }
        #chat-record.is-recording { border-color: var(--chat-coral); background: rgba(229,139,158,.2); color: var(--chat-coral-hover); }
        #chat-record:disabled { cursor: default; opacity: .42; }
        @media (max-width: 420px) {
            #chat-panel { width: calc(100vw - 16px); height: min(372px, calc(100vh - 16px)); }
            #chat-log { padding: 10px; }
            #chat-form { grid-template-columns: minmax(0, 1fr) 36px 48px; padding: 8px; }
            #chat-send { width: 48px; }
        }
    </style>
</head>
<body>
    <div id="landlord">
        <div class="message" style="opacity:0"></div>
        <canvas id="live2d" width="280" height="250"></canvas>
    </div>
    <!-- Live2D 渲染循环每帧读取 live_talk 值，缺失会导致渲染循环崩溃 -->
    <input type="hidden" id="live_talk" value="0">
    <section id="chat-panel" aria-label="AnimePet 对话">
        <div id="chat-head">
            <div class="chat-identity"><span class="chat-status"></span><span class="chat-name"><strong id="chat-character-name">AnimePet</strong><small>在这里陪着你</small></span></div>
            <div class="chat-actions">
                <button id="chat-model" type="button" aria-label="切换模型" title="切换模型" disabled>&#8644;</button>
                <button id="chat-mute" type="button" aria-label="静音" title="静音">&#128266;</button>
                <button id="chat-close" type="button" aria-label="关闭" title="关闭">×</button>
            </div>
        </div>
        <div id="chat-log"></div>
        <form id="chat-form"><textarea id="chat-input" placeholder="说点什么..." maxlength="4000" rows="1"></textarea><button id="chat-record" type="button" aria-label="语音输入" title="语音输入">&#127908;</button><button id="chat-send" type="submit">发送</button></form>
    </section>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script>
        var message_Path = './';
    </script>
    <script src="js/live2d.js"></script>
    <script src="js/lipsync.js"></script>
    <script src="js/message.js"></script>
    <script>
        // 模型加载由 message.js 在纹理预加载后统一执行，这里不再重复调用 loadlive2d
        // 独立实现拖拽（绕过 message.js 里 getEvent() 在现代 WebKitGTK 下失效的问题）
        // 拖拽期间扩大输入区域，拖拽结束/恢复位置时通过 document.title 与 Rust 同步
        (function () {
            var landlord = document.getElementById('landlord');
            var dragging = false;
            var moved = false;
            var activePointer = null;
            var startX = 0, startY = 0, startLeft = 0, startBottom = 0;

            landlord.addEventListener('pointerdown', function (e) {
                if (e.button !== 0) return;
                dragging = true;
                moved = false;
                activePointer = e.pointerId;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseInt(landlord.style.left) || 0;
                startBottom = parseInt(landlord.style.bottom) || 0;
                landlord.setPointerCapture(e.pointerId);
                document.title = 'drag_start';
                e.preventDefault();
            }, true);

            landlord.addEventListener('pointermove', function (e) {
                if (!dragging || e.pointerId !== activePointer) return;
                var dx = e.clientX - startX;
                var dy = e.clientY - startY;
                if (Math.hypot(dx, dy) > 12) moved = true;
                if (!moved) return;
                // bottom 是相对窗口底部的距离，向上拖 dy>0 则 bottom 增加
                landlord.style.left = (startLeft + dx) + 'px';
                landlord.style.bottom = (startBottom - dy) + 'px';
                if (window.updateChatPanel) window.updateChatPanel();
            });

            function finishPointer(e) {
                if (!dragging || e.pointerId !== activePointer) return;
                dragging = false;
                activePointer = null;
                var left = parseInt(landlord.style.left) || 0;
                var bottom = parseInt(landlord.style.bottom) || 0;
                if (!moved && window.openChatPanel) window.openChatPanel();
                // 持久化位置，下次启动时由 message.js 读取恢复
                sessionStorage.setItem('historywidth', left);
                sessionStorage.setItem('historyheight', bottom);
                if (moved) {
                    var chatOpen = document.getElementById('chat-panel').classList.contains('is-open');
                    document.title = chatOpen ? 'chat_open' : 'drag_end:' + left + ',' + bottom;
                }
                moved = false;
            }
            landlord.addEventListener('pointerup', finishPointer, true);
            landlord.addEventListener('pointercancel', finishPointer, true);

            // 启动时若 message.js 恢复了上次位置，通知 Rust 更新输入热区
            // DOMContentLoaded 时 message.js 的 $(document).ready 已执行完毕
            document.addEventListener('DOMContentLoaded', function () {
                var left = parseInt(landlord.style.left) || 0;
                var bottom = parseInt(landlord.style.bottom) || 0;
                if (left !== 0 || bottom !== 0) {
                    document.title = 'restore:' + left + ',' + bottom;
                }
            });
        })();

        // Chat UI talks to the Rust-local proxy; the API key never enters the WebView.
        (function () {
            var panel = document.getElementById('chat-panel');
            var close = document.getElementById('chat-close');
            var form = document.getElementById('chat-form');
            var input = document.getElementById('chat-input');
            var log = document.getElementById('chat-log');
            var recordButton = document.getElementById('chat-record');
            var mute = document.getElementById('chat-mute');
            var modelSwitch = document.getElementById('chat-model');
            var characterName = document.getElementById('chat-character-name');
            var voiceStatus = document.querySelector('.chat-name small');
            var audio = null;
            var speechRequest = null;
            var speechSequence = 0;
            var audioContext = null;
            var lipSyncFrame = null;
            var muted = localStorage.getItem('animepet-muted') === '1';
            var chatBusy = false;
            var recorder = null;
            var recordStream = null;
            var recordChunks = [];

            function addLine(role, text) { var node=document.createElement('div'); node.className='chat-line '+role; node.textContent=text; log.appendChild(node); log.scrollTop=log.scrollHeight; return node; }
            function setVoiceStatus(text, actionable) {
                voiceStatus.textContent = text;
                voiceStatus.classList.toggle('is-action', !!actionable);
                window.clearTimeout(setVoiceStatus.timer);
                if (text !== '在这里陪着你' && !actionable) setVoiceStatus.timer = window.setTimeout(function(){ setVoiceStatus('在这里陪着你'); }, 4500);
            }
            function updateMuteButton() {
                mute.classList.toggle('is-muted', muted);
                mute.innerHTML = muted ? '&#128263;' : '&#128266;';
                mute.setAttribute('aria-label', muted ? '取消静音' : '静音');
                mute.title = muted ? '取消静音' : '静音';
                if (audio) audio.muted = muted;
            }
            function stopSpeech() {
                speechSequence++;
                if (speechRequest) { speechRequest.abort(); speechRequest = null; }
                if (audio) {
                    var oldSrc = audio.src;
                    audio.pause();
                    audio.removeAttribute('src');
                    audio.load();
                    if (oldSrc) URL.revokeObjectURL(oldSrc);
                    audio = null;
                }
                if (lipSyncFrame) { cancelAnimationFrame(lipSyncFrame); lipSyncFrame = null; }
                if (window.setLive2dLipSyncValue) window.setLive2dLipSyncValue(0);
                setVoiceStatus('在这里陪着你');
                document.getElementById('live_talk').value = '0';
            }
            window.stopAnimePetSpeech = stopSpeech;
            function updateModelUi(model) {
                if (!model) return;
                characterName.textContent = model.name;
                modelSwitch.disabled = !!model.loading;
                var label = '切换模型（当前：' + model.name + '）';
                modelSwitch.setAttribute('aria-label', label);
                modelSwitch.title = label;
                setVoiceStatus(model.loading ? '正在切换模型...' : '在这里陪着你');
            }
            document.addEventListener('animepet:modelchange', function(event) {
                updateModelUi(event.detail);
            });
            modelSwitch.addEventListener('click', function() {
                if (window.cycleAnimePetModel) window.cycleAnimePetModel();
            });
            if (window.getAnimePetModel) updateModelUi(window.getAnimePetModel());
            function primeAudio() {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!audioContext) audioContext = new AudioContext();
                if (audioContext.state === 'suspended') audioContext.resume();
            }
            function connectLipSync(media) {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                primeAudio();
                var source = audioContext.createMediaElementSource(media);
                var analyser = audioContext.createAnalyser();
                var samples = new Uint8Array(analyser.fftSize = 256);
                analyser.smoothingTimeConstant = 0.68;
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                function updateMouth() {
                    analyser.getByteTimeDomainData(samples);
                    var energy = 0;
                    for (var i = 0; i < samples.length; i++) {
                        var normalized = (samples[i] - 128) / 128;
                        energy += normalized * normalized;
                    }
                    var rms = Math.sqrt(energy / samples.length);
                    if (window.setLive2dLipSyncValue) window.setLive2dLipSyncValue(muted ? 0 : Math.min(1, rms * 5.5));
                    lipSyncFrame = requestAnimationFrame(updateMouth);
                }
                updateMouth();
            }
            async function playAudio() {
                if (!audio || muted) return;
                try {
                    primeAudio();
                    await audio.play();
                } catch (error) {
                    setVoiceStatus('点这里播放语音', true);
                }
            }
            async function speak(text) {
                if (muted) { setVoiceStatus('已静音'); return; }
                if (!text) return;
                stopSpeech();
                var sequence = ++speechSequence;
                speechRequest = new AbortController();
                setVoiceStatus('正在合成语音...');
                try {
                    var response = await fetch('/tts', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({text: text}),
                        signal: speechRequest.signal
                    });
                    if (!response.ok) throw new Error(await response.text());
                    var voiceType = response.headers.get('X-AnimePet-TTS');
                    var blob = await response.blob();
                    if (sequence !== speechSequence || muted) return;
                    var currentAudio = new Audio(URL.createObjectURL(blob));
                    audio = currentAudio;
                    currentAudio.muted = muted;
                    currentAudio.preload = 'auto';
                    connectLipSync(currentAudio);
                    currentAudio.addEventListener('play', function(){ document.getElementById('live_talk').value='1'; setVoiceStatus(voiceType === 'fallback' ? '正在说话（系统语音）' : '正在说话'); });
                    currentAudio.addEventListener('ended', function(){
                        URL.revokeObjectURL(currentAudio.src);
                        if (audio === currentAudio) {
                            if (lipSyncFrame) { cancelAnimationFrame(lipSyncFrame); lipSyncFrame=null; }
                            if (window.setLive2dLipSyncValue) window.setLive2dLipSyncValue(0);
                            document.getElementById('live_talk').value='0';
                            setVoiceStatus('在这里陪着你');
                            audio=null;
                        }
                    });
                    currentAudio.addEventListener('error', function(){
                        if (currentAudio.src) URL.revokeObjectURL(currentAudio.src);
                        if (audio === currentAudio) {
                            document.getElementById('live_talk').value='0';
                            audio=null;
                            setVoiceStatus('语音播放失败');
                        }
                    });
                    await playAudio();
                } catch (error) {
                    if (error.name !== 'AbortError') setVoiceStatus('语音未播放：' + error.message);
                } finally {
                    if (sequence === speechSequence) speechRequest = null;
                }
            }
            voiceStatus.addEventListener('click', function(){
                if (voiceStatus.classList.contains('is-action')) playAudio();
            });
            mute.addEventListener('click', function(){
                muted = !muted;
                localStorage.setItem('animepet-muted', muted ? '1' : '0');
                if (muted) stopSpeech();
                updateMuteButton();
            });
            updateMuteButton();
            function positionPanel() {
                if (!panel.classList.contains('is-open')) return;
                var pet = document.getElementById('landlord').getBoundingClientRect();
                var gap = 12;
                var panelWidth = panel.offsetWidth;
                var panelHeight = panel.offsetHeight;
                var left = pet.right + gap;
                if (left + panelWidth > window.innerWidth - 12) left = pet.left - panelWidth - gap;
                left = Math.max(12, Math.min(left, window.innerWidth - panelWidth - 12));
                var top = pet.bottom - panelHeight;
                top = Math.max(12, Math.min(top, window.innerHeight - panelHeight - 12));
                panel.style.left = Math.round(left) + 'px';
                panel.style.top = Math.round(top) + 'px';
            }
            window.updateChatPanel = positionPanel;
            window.openChatPanel = function(){ panel.classList.add('is-open'); positionPanel(); document.title='chat_open'; setTimeout(function(){ input.focus(); }, 50); };
            close.addEventListener('click', function(){
                panel.classList.remove('is-open');
                var left = parseInt(document.getElementById('landlord').style.left) || 0;
                var bottom = parseInt(document.getElementById('landlord').style.bottom) || 0;
                document.title='chat_close:' + left + ',' + bottom;
            });
            window.addEventListener('resize', positionPanel);
            input.addEventListener('keydown', function(e){
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
            });
            input.addEventListener('input', function(){
                input.style.height = '38px';
                input.style.height = Math.min(input.scrollHeight, 82) + 'px';
            });
            function setRecordingUi(recording) {
                recordButton.classList.toggle('is-recording', recording);
                recordButton.innerHTML = recording ? '&#9632;' : '&#127908;';
                recordButton.setAttribute('aria-label', recording ? '停止录音' : '语音输入');
                recordButton.title = recording ? '停止录音' : '语音输入';
                if (recording) setVoiceStatus('正在录音，再点一次结束');
            }
            function recordingMimeType() {
                var options = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
                for (var i = 0; i < options.length; i++) {
                    if (!window.MediaRecorder.isTypeSupported || window.MediaRecorder.isTypeSupported(options[i])) return options[i];
                }
                return '';
            }
            async function transcribeRecording(blob, mime) {
                setVoiceStatus('正在识别语音...');
                try {
                    var response = await fetch('/stt', {method: 'POST', headers: {'Content-Type': mime || 'audio/webm'}, body: blob});
                    var payload = await response.text();
                    if (!response.ok) throw new Error(payload || ('HTTP ' + response.status));
                    var result = JSON.parse(payload);
                    var text = (result.text || '').trim();
                    if (!text) throw new Error('没有识别出文字');
                    input.value = input.value.trim() ? input.value.trim() + ' ' + text : text;
                    input.dispatchEvent(new Event('input'));
                    input.focus();
                    setVoiceStatus('语音已填入输入框');
                } catch (error) {
                    setVoiceStatus('语音识别失败：' + error.message);
                }
            }
            function stopRecording() {
                if (recorder && recorder.state !== 'inactive') recorder.stop();
            }
            recordButton.addEventListener('click', async function(){
                if (recorder && recorder.state === 'recording') { stopRecording(); return; }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
                    setVoiceStatus('当前环境不支持录音');
                    return;
                }
                try {
                    recordStream = await navigator.mediaDevices.getUserMedia({audio: true});
                    var mime = recordingMimeType();
                    recorder = mime ? new MediaRecorder(recordStream, {mimeType: mime}) : new MediaRecorder(recordStream);
                    recordChunks = [];
                    recorder.addEventListener('dataavailable', function(event){ if (event.data && event.data.size) recordChunks.push(event.data); });
                    recorder.addEventListener('stop', function(){
                        var actualMime = recorder.mimeType || mime || 'audio/webm';
                        var blob = new Blob(recordChunks, {type: actualMime});
                        if (recordStream) recordStream.getTracks().forEach(function(track){ track.stop(); });
                        recordStream = null;
                        recorder = null;
                        setRecordingUi(false);
                        if (blob.size) transcribeRecording(blob, actualMime);
                    }, {once: true});
                    recorder.start();
                    setRecordingUi(true);
                } catch (error) {
                    if (recordStream) recordStream.getTracks().forEach(function(track){ track.stop(); });
                    recordStream = null;
                    recorder = null;
                    setVoiceStatus('无法访问麦克风：' + error.message);
                }
            });
            form.addEventListener('submit', async function(e){
                e.preventDefault(); var text=input.value.trim(); if(!text || chatBusy) return;
                stopRecording();
                chatBusy = true;
                document.getElementById('chat-send').disabled = true;
                primeAudio();
                stopSpeech();
                input.value=''; addLine('user', text); var reply=addLine('assistant','思考中...');
                try {
                    var selectedModel = window.getAnimePetModel ? window.getAnimePetModel().id : 'katoumegumi';
                    var response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,model:selectedModel})});
                    if(!response.ok || !response.body) throw new Error('HTTP '+response.status);
                    reply.textContent=''; var reader=response.body.getReader(), decoder=new TextDecoder(); var pending='';
                    while(true){ var part=await reader.read(); if(part.done) break; pending+=decoder.decode(part.value,{stream:true}); var lines=pending.split('\n'); pending=lines.pop();
                        lines.forEach(function(line){ if(!line) return; try { var event=JSON.parse(line); if(event.type==='delta'){ reply.textContent+=event.text; log.scrollTop=log.scrollHeight; } else if(event.type==='done' && event.text){ reply.textContent=event.text; log.scrollTop=log.scrollHeight; speak(event.text); } else if(event.type==='error'){ reply.textContent='出错了：'+event.text; } } catch(_){} }); }
                } catch(err) { reply.textContent='连接失败：'+err.message; }
                finally {
                    chatBusy = false;
                    document.getElementById('chat-send').disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
