<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="animepet-token" content="__ANIMEPET_TOKEN__">
    <title>Anime Pet</title>
    <link rel="stylesheet" href="css/pet.css">
</head>
<body>
    <div id="landlord">
        <div class="message" style="opacity:0"></div>
        <div id="boot-hint" class="boot-hint" role="status">正在加载模型…</div>
        <canvas id="live2d" width="280" height="300"></canvas>
    </div>
    <!-- Live2D 渲染循环每帧读取 live_talk 值，缺失会导致渲染循环崩溃 -->
    <input type="hidden" id="live_talk" value="0">

    <!-- ============================================================ 聊天面板 -->
    <section id="chat-panel" class="surface" aria-label="AnimePet 对话">
        <div id="chat-head">
            <div class="chat-identity">
                <span class="chat-avatar" aria-hidden="true"><span id="chat-avatar-text">加</span></span>
                <span class="chat-name">
                    <strong id="chat-character-name">AnimePet</strong>
                    <small>在这里陪着你</small>
                </span>
            </div>
            <div class="chat-actions">
                <button id="chat-status" class="icon-btn" type="button" aria-label="陪伴面板" data-tip="陪伴面板">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.3-4.6-7.3-9.6A4.2 4.2 0 0 1 12 8.3a4.2 4.2 0 0 1 7.3 2.6c0 5-7.3 9.6-7.3 9.6z"/></svg>
                </button>
                <button id="chat-model" class="icon-btn" type="button" aria-label="切换模型" data-tip="切换模型" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13"/><path d="M14 4l3 3-3 3"/><path d="M20 17H7"/><path d="M10 14l-3 3 3 3"/></svg>
                </button>
                <button id="chat-mute" class="icon-btn" type="button" aria-label="静音" data-tip="静音">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5H4z"/><path d="M16.4 8.8a4.6 4.6 0 0 1 0 6.4"/><path d="M18.9 6.2a8.2 8.2 0 0 1 0 11.6"/></svg>
                </button>
                <button id="chat-close" class="icon-btn" type="button" aria-label="关闭" data-tip="关闭">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </div>
        <div id="chat-log" role="log" aria-live="polite"></div>
        <div id="chat-announcer" class="sr-only" role="status" aria-live="polite"></div>
        <form id="chat-form">
            <textarea id="chat-input" placeholder="说点什么..." maxlength="4000" rows="1" aria-label="输入消息"></textarea>
            <button id="chat-record" class="icon-btn tip-up" type="button" aria-label="语音输入" data-tip="语音输入">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
            </button>
            <button id="chat-voice-mode" class="icon-btn tip-up" type="button" aria-label="语音对话模式" data-tip="语音对话">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5h9a3.5 3.5 0 0 1 3.5 3.5v3a3.5 3.5 0 0 1-3.5 3.5H9L5 20v-2.5H4.5z"/><path d="M19 9v6"/></svg>
            </button>
            <button id="chat-send" type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13"/><path d="M12 6l6 6-6 6"/></svg>
                <span>发送</span>
            </button>
        </form>
    </section>

    <!-- ============================================================ 陪伴面板 -->
    <aside id="pet-hud" class="surface" aria-label="陪伴中心" data-mood="calm">
        <div class="hud-head">
            <div class="hud-title">
                <strong id="hud-name">AnimePet</strong>
                <div class="hud-sub">
                    <span class="hud-level" id="hud-level">Lv.1 · 初见</span>
                    <span class="hud-stage" id="hud-stage">初见</span>
                </div>
            </div>
            <div class="chat-actions">
                <button id="hud-chat" class="icon-btn" type="button" aria-label="打开聊天" data-tip="聊天">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5h15v9a2 2 0 0 1-2 2H9l-4.5 3v-3z"/><path d="M8 11.5h8"/><path d="M8 14.5h5"/></svg>
                </button>
                <button id="hud-close" class="icon-btn" type="button" aria-label="关闭陪伴中心" data-tip="关闭">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </div>

        <nav class="center-tabs" id="hud-tabs" role="tablist" aria-label="陪伴中心分区">
            <span class="tab-indicator" aria-hidden="true"></span>
            <button class="tab-btn is-active" type="button" role="tab" id="tab-status" aria-controls="page-status" aria-selected="true" data-tab="status">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.3-4.6-7.3-9.6A4.2 4.2 0 0 1 12 8.3a4.2 4.2 0 0 1 7.3 2.6c0 5-7.3 9.6-7.3 9.6z"/></svg>
                <span>状态</span>
            </button>
            <button class="tab-btn" type="button" role="tab" id="tab-interact" aria-controls="page-interact" aria-selected="false" data-tab="interact">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.7 4.6 4.8 1.7-4.8 1.7L12 16.1l-1.7-4.6L5.5 9.8l4.8-1.7z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
                <span>互动</span>
            </button>
            <button class="tab-btn" type="button" role="tab" id="tab-memory" aria-controls="page-memory" aria-selected="false" data-tab="memory">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h11a2 2 0 0 1 2 2v11H7a2 2 0 0 1-2-2z"/><path d="M8.5 9h6M8.5 12.5h4"/><path d="M18 8.5h1.5v10H8"/></svg>
                <span>回忆</span>
            </button>
        </nav>

        <div class="tab-pages">
            <section class="tab-page is-active" id="page-status" role="tabpanel" aria-labelledby="tab-status">
                <div class="mood-card" id="hud-mood">
                    <span class="mood-emoji" id="hud-mood-emoji" aria-hidden="true">🌙</span>
                    <div class="mood-copy">
                        <b id="hud-mood-label">平静</b>
                        <small id="hud-mood-hint">安静地待在你旁边</small>
                    </div>
                    <span class="mood-days" id="hud-days">第 1 天</span>
                </div>

                <div class="hud-stats">
                    <div class="stat" data-stat="affection">
                        <div class="stat-top"><span>亲密度</span><b>0%</b></div>
                        <div class="bar"><i></i></div>
                    </div>
                    <div class="stat" data-stat="mood">
                        <div class="stat-top"><span>心情</span><b>0%</b></div>
                        <div class="bar"><i></i></div>
                    </div>
                    <div class="stat" data-stat="hunger">
                        <div class="stat-top"><span>饱食</span><b>0%</b></div>
                        <div class="bar"><i></i></div>
                    </div>
                    <div class="stat" data-stat="energy">
                        <div class="stat-top"><span>精力</span><b>0%</b></div>
                        <div class="bar"><i></i></div>
                    </div>
                </div>

                <div class="hud-exp">
                    <span>经验</span>
                    <div class="bar"><i id="hud-exp-fill"></i></div>
                    <span id="hud-exp-text">0 / 24</span>
                </div>

                <div class="hud-stagebar">
                    <div class="stage-track"><i id="hud-stage-fill"></i></div>
                    <span id="hud-stage-text">初见 0 / 20</span>
                </div>

                <p class="hud-tip">双击摸摸头 · 右键打开菜单 · 拖动可移动</p>
            </section>

            <section class="tab-page" id="page-interact" role="tabpanel" aria-labelledby="tab-interact" hidden>
                <div class="hud-actions">
                    <button class="action-btn" type="button" data-action="feed">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5h16a8 8 0 0 1-16 0z"/><path d="M9 8.5c0-1.4 1.2-1.9 1.2-3"/><path d="M14 8.5c0-1.4 1.2-1.9 1.2-3"/></svg>
                        <span>投喂</span>
                    </button>
                    <button class="action-btn" type="button" data-action="play">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="11" rx="3.2"/><path d="M8.5 11.5v4M6.5 13.5h4"/><circle cx="16.2" cy="12.4" r=".9" fill="currentColor" stroke="none"/><circle cx="18.2" cy="14.6" r=".9" fill="currentColor" stroke="none"/></svg>
                        <span>猜拳</span>
                    </button>
                    <button class="action-btn" type="button" data-action="focus">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12.5" r="7.5"/><path d="M12 8.5v4.2l2.6 1.6"/></svg>
                        <span>专注</span>
                    </button>
                </div>

                <div class="gift-block">
                    <div class="gift-title"><span>送点小礼物</span><small id="hud-gift-hint">每个角色都有偏好</small></div>
                    <div class="gift-grid" id="hud-gifts">
                        <button class="gift-btn" type="button" data-gift="sweet"><span class="gift-emoji">🍰</span><span>甜点</span></button>
                        <button class="gift-btn" type="button" data-gift="tea"><span class="gift-emoji">🍵</span><span>热茶</span></button>
                        <button class="gift-btn" type="button" data-gift="flower"><span class="gift-emoji">🌸</span><span>花</span></button>
                        <button class="gift-btn" type="button" data-gift="book"><span class="gift-emoji">📖</span><span>书</span></button>
                    </div>
                </div>

                <div class="streak-card" id="hud-streak">
                    <span class="streak-flame" aria-hidden="true">🔥</span>
                    <div class="streak-copy">
                        <b id="hud-streak-days">连续 0 天</b>
                        <small id="hud-streak-hint">今天还没签到</small>
                    </div>
                    <span class="streak-count" id="hud-checkins">0 次</span>
                </div>
            </section>

            <section class="tab-page" id="page-memory" role="tabpanel" aria-labelledby="tab-memory" hidden>
                <ul class="journal-list" id="hud-journal" aria-live="polite"></ul>
            </section>
        </div>

        <div class="hud-focus" id="hud-focus" hidden>
            <div class="hud-focus-time"><b id="hud-focus-time">25:00</b><span id="hud-focus-label">专注中</span></div>
            <button class="ghost-btn" type="button" id="hud-focus-stop">结束</button>
        </div>

        <div class="hud-foot">
            <label class="toggle">
                <input type="checkbox" id="hud-water" checked>
                <span class="switch" aria-hidden="true"></span>
                <span>喝水提醒</span>
            </label>
            <label class="toggle">
                <input type="checkbox" id="hud-hourly">
                <span class="switch" aria-hidden="true"></span>
                <span>整点报时</span>
            </label>
        </div>
    </aside>

    <!-- ============================================================ 右键菜单 -->
    <div id="pet-menu" class="surface" role="group" aria-label="桌宠菜单">
        <button class="pet-menu-item" type="button" data-action="hud">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.3-4.6-7.3-9.6A4.2 4.2 0 0 1 12 8.3a4.2 4.2 0 0 1 7.3 2.6c0 5-7.3 9.6-7.3 9.6z"/></svg>
            <span>陪伴面板</span>
        </button>
        <button class="pet-menu-item" type="button" data-action="focus">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12.5" r="7.5"/><path d="M12 8.5v4.2l2.6 1.6"/></svg>
            <span>开始专注</span>
            <span class="menu-hint">25 分钟</span>
        </button>
        <button class="pet-menu-item" type="button" data-action="chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5h15v9a2 2 0 0 1-2 2H9l-4.5 3v-3z"/><path d="M8 11.5h8"/><path d="M8 14.5h5"/></svg>
            <span>陪我聊聊</span>
        </button>
        <div class="pet-menu-sep" role="separator"></div>
        <button class="pet-menu-item" type="button" data-action="feed">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5h16a8 8 0 0 1-16 0z"/><path d="M9 8.5c0-1.4 1.2-1.9 1.2-3"/><path d="M14 8.5c0-1.4 1.2-1.9 1.2-3"/></svg>
            <span>投喂</span>
        </button>
        <button class="pet-menu-item" type="button" data-action="play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="11" rx="3.2"/><path d="M8.5 11.5v4M6.5 13.5h4"/><circle cx="16.2" cy="12.4" r=".9" fill="currentColor" stroke="none"/><circle cx="18.2" cy="14.6" r=".9" fill="currentColor" stroke="none"/></svg>
            <span>猜拳</span>
        </button>
        <button class="pet-menu-item" type="button" data-action="hide-bubble">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 3.5z"/><path d="M8 9h8M8 12h5"/></svg>
            <span>收起气泡</span>
        </button>
        <div class="pet-menu-sep" role="separator"></div>
        <button class="pet-menu-item" type="button" data-action="quit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5.5H6.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2H15"/><path d="M12 12h8"/><path d="M17 9l3 3-3 3"/></svg>
            <span>退出 AnimePet</span>
        </button>
    </div>

    <!-- ============================================================ 猜拳 -->
    <div id="pet-rps" role="dialog" aria-modal="true" aria-label="猜拳小游戏">
        <div class="rps-card surface">
            <h3>猜拳</h3>
            <p>赢了我，好感与经验都会上涨</p>
            <div class="rps-stage">
                <div class="rps-hand" id="rps-you" aria-label="你的出拳">❔</div>
                <span class="rps-vs">VS</span>
                <div class="rps-hand" id="rps-pet" aria-label="桌宠的出拳">❔</div>
            </div>
            <p class="rps-result" id="rps-result">出什么？赢了我会有奖励哦。</p>
            <div class="rps-choices">
                <button class="rps-choice" type="button" data-hand="rock"><span>✊</span>石头</button>
                <button class="rps-choice" type="button" data-hand="scissors"><span>✌️</span>剪刀</button>
                <button class="rps-choice" type="button" data-hand="paper"><span>🖐</span>布</button>
            </div>
            <button class="ghost-btn" type="button" id="rps-close">先不玩了</button>
        </div>
    </div>

    <div id="pet-toast" role="status" aria-live="polite"></div>

    <!-- ============================================================ 脚本 -->
    <script src="js/vendor/jquery.min.js"></script>
    <script src="js/live2d.js"></script>
    <script src="js/lipsync.js"></script>
    <script src="js/cubism3.js"></script>
    <script src="js/message.js"></script>
    <script src="js/pet-state.js"></script>
    <script src="js/pet-region.js"></script>
    <script src="js/pet-ui.js"></script>
    <script src="js/pet-rps.js"></script>
    <script src="js/pet-tabs.js"></script>
    <script src="js/pet-reminders.js"></script>
    <script src="js/pet-interact.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
